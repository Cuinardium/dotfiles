[opener]
# Your custom editor override
edit = [
    { run = 'nvim "$@"', desc = "Neovim", block = true, for = "unix" },
]

# Your custom PDF viewer
pdf = [
    { run = 'zathura "$@"', desc = "Zathura", orphan = true, for = "unix" },
]

[open]
prepend_rules = [
    # This maps your custom Zathura opener to PDF files (which was missing in your config)
    { mime = "application/pdf", use = [ "pdf", "reveal" ] },
]
