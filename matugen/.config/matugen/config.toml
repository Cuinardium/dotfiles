[config]


[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.cava]
input_path = './templates/cava-colors.ini'
output_path = '~/.config/cava/config'

[templates.clipse]
input_path = './templates/clipse_theme.json'
output_path = '~/.config/clipse/custom_theme.json'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = 'systemctl --user restart xdg-desktop-portal-gtk.service'



[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.qt5ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.hyprland]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/colors/colors.lua'

[templates.discord]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/BetterDiscord/themes/midnight.theme.css'

[templates.nvim]
input_path = './templates/template.lua'
output_path = '~/.config/nvim/lua/cuini/matugen.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.opencode]
input_path = './templates/opencode-colors.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.spotify]
input_path = './templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'spicetify watch -s 2>&1 | sed "/Reloaded Spotify/q"'

[templates.starship]
input_path = './templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[templates.television]
input_path = './templates/television.toml'
output_path = '~/.config/television/themes/matugen.toml'

[templates.tmux]
input_path = './templates/tmux-colors.conf'
output_path = '~/.config/tmux/generated.conf'
post_hook = 'tmux source-file ~/.config/tmux/generated.conf'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.zathura]
input_path = './templates/zathura-colors'
output_path = '~/.config/zathura/generated'

[templates.obsidian]
input_path = './templates/obsidian.css'
output_path = '~/Documents/Zettlekasten/.obsidian/snippets/matugen.css'

[templates.pywalfox]
input_path = './templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.startpage]
input_path = './templates/startpage.css'
output_path = '~/Repos/startpage/matugen/matugen-colors.css'

[templates.lazygit]
input_path = './templates/lazygit.yml'
output_path = '~/.config/lazygit/config.yml'

[templates.quickshell]
input_path = './templates/colors.json'
output_path = '~/Repos/hyprland-shell/style/colors.json'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = 'kitty +kitten themes --reload-in=all Matugen'
